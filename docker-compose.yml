
# Tạo mạng dùng chung cho tất cả các container
networks:
  app-network:
    driver: bridge

# Khai báo các Volume lưu trữ dữ liệu bền vững
volumes:
  db_data:
  wordpress_data:
  grafana_data:
  loki_data:

services:
  # --- 1. CƠ SỞ DỮ LIỆU MYSQL ---
  # Áp dụng Hardening: Sử dụng user riêng wp_user thay vì truy cập bằng root
  db:
    image: mysql:8.0
    container_name: wordpress_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: SecureRootPassword123!
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: SecureWpPassword123!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # --- 2. WEBSITE WORDPRESS ---
  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: always
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: SecureWpPassword123!
      WORDPRESS_DB_NAME: wordpress_db
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - app-network

  # --- 3. PHPMYADMIN ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: wordpress_phpmyadmin
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - app-network

  # --- 4. NGINX REVERSE PROXY ---
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./website:/usr/share/nginx/html:ro
    depends_on:
      - wordpress
      - phpmyadmin
    networks:
      - app-network

  # --- 5. PROMETHEUS (MONITORING) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - app-network

  # --- 6. GRAFANA (DASHBOARD) ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network

  # --- 7. NODE EXPORTER ---
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: always
    networks:
      - app-network

  # --- 8. CADVISOR ---
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - app-network

  # --- 9. LOKI (LOG SYSTEM) ---
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - app-network

  # --- 10. PROMTAIL (LOG COLLECTOR) ---
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - app-network